version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: repopilot-db
    environment:
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: repopilot_password
      POSTGRES_DB: repopilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot -d repopilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: repopilot-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://repopilot:repopilot_password@db:5432/repopilot_db
      SECRET_KEY: repopilot-super-secret-development-key-change-in-production-32chars
      LLM_PROVIDER: mock
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_DEFAULT_TOKEN: ${GITHUB_DEFAULT_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: repopilot-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
