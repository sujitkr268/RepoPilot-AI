services:
  # ============================================================================
  # Backend API Service (FastAPI + LangGraph)
  # ============================================================================
  - type: web
    name: repopilot-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: repopilot-db
          property: connectionString
      - key: LLM_PROVIDER
        value: mock
      - key: BACKEND_CORS_ORIGINS
        value: "http://localhost:3000"

  # ============================================================================
  # Frontend Web Service (Next.js 14)
  # ============================================================================
  - type: web
    name: repopilot-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: repopilot-backend
          property: host

databases:
  # ============================================================================
  # Managed PostgreSQL Database
  # ============================================================================
  - name: repopilot-db
    region: oregon
    plan: free
    databaseName: repopilot
    user: repopilot_user
